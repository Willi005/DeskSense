; Configuración de PlatformIO para el firmware del ESP32 de DeskSense.
;
; Esta carpeta se abre como proyecto propio en VS Code (Archivo > Abrir carpeta >
; esp32). `src_dir = .` hace que PlatformIO compile el .ino que vive aquí, en vez
; de buscar en ../src, que en este repositorio es la aplicación de React y no
; tiene nada que ver con el firmware.

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; La misma velocidad que declara Serial.begin en el firmware. Si no coinciden,
; el monitor serie muestra caracteres sin sentido.
monitor_speed = 115200

; Velocidad de grabación. Por defecto PlatformIO usa 460800, que en este equipo
; corrompía los datos en el cable y hacía fallar la subida con "Checksum error"
; justo después de identificar el chip. A 115200 es más lento pero fiable, que es
; lo que importa cuando grabar mal deja la placa sin arrancar.
upload_speed = 115200

; Traduce las direcciones de memoria de un reinicio por excepción a nombres de
; función y número de línea. Sin esto, un cuelgue solo imprime números hex.
monitor_filters = esp32_exception_decoder

; Versiones fijadas para que una actualización del registro no rompa una
; compilación que ya funcionaba.
;
; Nota sobre la SPS30: el registro de PlatformIO publica la 1.0.0, mientras que
; el gestor de librerías de Arduino tiene la 1.0.1. El rango ^1.0.0 acepta
; cualquiera de las dos. `Sensirion Core` es dependencia suya y se instala sola.
lib_deps =
    sensirion/Sensirion I2C SPS30@^1.0.0
    beegee-tokyo/DHT sensor library for ESPx@^1.19
    knolleary/PubSubClient@^2.8
